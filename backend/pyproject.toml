# Vercel deployment config for the FastAPI backend.
#
# Vercel looks for a FastAPI instance named `app`. It lives in main.py, which
# is already a supported entrypoint name, so this file mostly exists to be
# explicit — and to keep the project root unambiguous when the repository also
# contains a Vite frontend deployed as a separate project.

[project]
name = "pdf-extractor-api"
version = "0.1.0"
requires-python = ">=3.11"

[tool.vercel]
entrypoint = "main:app"
